name: Snapshot Automatique Minuit

on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
  push:
    branches:
      - main # ⚡ L'électrochoc : force GitHub à réveiller le robot à chaque sauvegarde

jobs:
  take-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances nécessaires
        run: |
          pip install pandas supabase

      - name: Lancer le script de capture
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python take_snapshot.py
