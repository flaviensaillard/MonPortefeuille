name: Run Daily Robot

on:
  schedule:
    # S'exécute tous les jours à 23h00 UTC (soit minuit ou 1h du matin en France selon l'heure d'été/hiver)
    - cron: '0 23 * * *'
  workflow_dispatch: # Te permet de lancer le robot manuellement depuis l'onglet "Actions" de GitHub pour tester

jobs:
  run-robot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas supabase

      - name: Exécution du script du Robot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python cron_robot.py
